name: Update User Guide

on:
  push:
    paths:
      - 'userguide/**'

jobs:
  update-userguide:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v2
      - name: Set up Java 11
        uses: actions/setup-java@v2
        with:
          java-version: '11'
          distribution: 'adopt'
      - name: Setup sdkman and install znai
        uses: sdkman/sdkman-action@master
        with:
          sdk: znai=1.69
      - name: Build and Deploy User Guide
        run: |
          cd userguide
          znai --doc-id groovy-ngs-utils/userguide --deploy ./deploy
      - name: Commit and Push Updates
        run: |
          git clone git@github.com:ssadedin/ssadedin.github.io.git deploy_repo
          cp -r deploy/* deploy_repo/groovy-ngs-utils/userguide/
          cd deploy_repo
          git add .
          git commit -m 'Update user guide for groovy-ngs' || echo "No changes to commit"
          git push
